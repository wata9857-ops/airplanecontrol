<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05090d">
<title>JP ATC Sim — Kansai / Kanto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2304080c%22/%3E%3Cpath d=%22M3 11h10M8 3v10%22 stroke=%22%234fd1c5%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="grp" id="areaBtns"></div>
    <button id="btnView" class="tb">VIEW ▾</button>
    <div class="grp grow" id="clockGrp">
      <span id="clock">--:--:--</span><span class="jst">JST</span>
      <button id="btnPause" class="tb">❚❚</button>
      <button id="btnSpeed" class="tb">×1</button>
    </div>
    <div class="grp">
      <button id="btnAlerts" class="tb">⚠ <span id="alertCount">0</span></button>
      <button id="btnLists" class="tb">STRIPS</button>
      <button id="btnMenu" class="tb">☰</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="radar"></canvas>
    <div id="levelBadge"></div>
    <div id="zoomCtl"><button id="zIn">＋</button><button id="zOut">－</button></div>
    <div id="toast"></div>
  </main>
  <aside id="panel" class="hidden"></aside>
  <aside id="lists" class="hidden"></aside>
  <div id="menu" class="hidden"></div>
  <div id="viewMenu" class="hidden"></div>
  <div id="loading">Loading navigation data…</div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
